# Atualiza os dados do site com a Wiki idleDEX uma vez por dia.
# Funciona sozinho quando o projeto estiver no GitHub (com GitHub Pages ligado).
name: Atualizar dados da wiki

on:
  schedule:
    - cron: '0 4 * * *'    # todo dia à 01:00 de Brasília (04:00 UTC)
  workflow_dispatch: {}     # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extrair a wiki
        run: node scripts/extract-wiki.mjs
      - name: Montar o arquivo do site
        run: node scripts/build-data.mjs
      - name: Salvar se mudou
        run: |
          git config user.name "guerreiros-z-bot"
          git config user.email "guerreiros-z-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/wiki.json; then
            echo "Nada mudou na wiki."
            exit 0
          fi
          git commit -m "Atualiza dados da wiki"
          # se alguém publicou algo enquanto a extração rodava, junta antes de enviar
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          echo "::error::Não consegui enviar. Confira Settings > Actions > General > Workflow permissions = Read and write."
          exit 1
